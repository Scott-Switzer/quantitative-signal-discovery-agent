# Signal Discovery Workflow: generate -> code -> evaluate -> feedback loop.
# Run `phoenix serve` in a separate terminal to view traces at localhost:6006.
#
# LOCAL PROXY variant: the three LLMs point at a local OpenAI-compatible
# proxy on 127.0.0.1:8000 (see nim_proxy.py) instead of NVIDIA NIM directly.
# The proxy forwards to NVIDIA NIM using a stored credential, so the agent
# itself never needs a real API key. Start the proxy first, then run:
#   nat run --config_file configs/config-optimization-local.yml --input "..."

general:
  telemetry:
    tracing:
      phoenix:
        _type: phoenix
        endpoint: http://localhost:6006/v1/traces
        project: signal-discovery-workflow

llms:
  signal_generator:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "http://127.0.0.1:8000/v1/"
    temperature: 0.8
    max_tokens: 4000
    chat_template_kwargs:
      enable_thinking: false

  code_generator:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "http://127.0.0.1:8000/v1/"
    temperature: 0.0
    max_tokens: 3000
    chat_template_kwargs:
      enable_thinking: false

  optimization_advisor:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "http://127.0.0.1:8000/v1/"
    temperature: 0.5
    max_tokens: 2000
    chat_template_kwargs:
      enable_thinking: false

workflow:
  _type: signal_optimizer
  signal_generator_llm: signal_generator
  code_generator_llm: code_generator
  optimization_advisor_llm: optimization_advisor
  ic_threshold: 0.02
  p_value_threshold: 0.05
  max_iterations: 3
  num_signals: 2
  forward_periods: 5
  # Out-of-sample split: the headline IC and the acceptance decision use the
  # TEST period only. Train IC is reported alongside so overfitting is visible.
  train_end_date: "2020-12-31"
  test_start_date: "2021-01-01"
  # Sector-neutralized Rank IC (demean signal and returns by GICS sector per
  # date) when data/sp500/sectors.csv is present. Falls back to the raw IC
  # when the map is missing.
  sector_neutralize: true
  save_results: true
