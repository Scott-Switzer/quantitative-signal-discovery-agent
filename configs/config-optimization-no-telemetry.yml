# Signal Discovery Workflow (no-telemetry): identical evaluation semantics to
# config-optimization.yml with the Phoenix exporter stripped, for cloud / Brev
# runs where there is no `phoenix serve` process.
#
# This file must stay in sync with config-optimization.yml. Previously it
# omitted the out-of-sample split and sector-neutralization settings, so the QA
# workflow silently tested a different (older) scoring configuration.

llms:
  signal_generator:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.8
    max_tokens: 4000
    chat_template_kwargs:
      enable_thinking: false

  code_generator:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.0
    max_tokens: 3000
    chat_template_kwargs:
      enable_thinking: false

  optimization_advisor:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.5
    max_tokens: 2000
    chat_template_kwargs:
      enable_thinking: false

workflow:
  _type: signal_optimizer
  signal_generator_llm: signal_generator
  code_generator_llm: code_generator
  optimization_advisor_llm: optimization_advisor
  ic_threshold: 0.02
  p_value_threshold: 0.05
  max_iterations: 4
  num_signals: 6
  forward_periods: 5
  train_end_date: "2020-12-31"
  validation_end_date: "2024-12-31"
  test_start_date: "2021-01-01"
  sector_neutralize: true
  min_names: 10
  cost_bps: 10.0
  screen_quantile: 0.2
  ic_decay_horizons: "1,5,10,21,63"
  data_source: null
  results_uri: null
  registry_path: null
  dedupe_trials: true
  save_results: true
