# Signal Discovery Workflow: generate -> code -> evaluate -> feedback loop.
# Run `phoenix serve` in a separate terminal to view traces at localhost:6006.

general:
  telemetry:
    tracing:
      phoenix:
        _type: phoenix
        endpoint: http://localhost:6006/v1/traces
        project: signal-discovery-workflow

llms:
  signal_generator:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.8
    max_tokens: 4000
    chat_template_kwargs:
      enable_thinking: false

  code_generator:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.0
    max_tokens: 3000
    chat_template_kwargs:
      enable_thinking: false

  optimization_advisor:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.5
    max_tokens: 2000
    chat_template_kwargs:
      enable_thinking: false

workflow:
  _type: signal_optimizer
  signal_generator_llm: signal_generator
  code_generator_llm: code_generator
  optimization_advisor_llm: optimization_advisor

  # Acceptance is measured on the VALIDATION window only.
  ic_threshold: 0.02
  p_value_threshold: 0.05

  # More exploration per unit of wall clock. Six ideas per iteration and four
  # iterations is 24 candidates instead of the old 6; every candidate is
  # evaluated separately and recorded in the ledger.
  max_iterations: 4
  num_signals: 6
  forward_periods: 5

  # Purged three-way split. Train ends 2020-12-31, validation runs
  # 2021-01-01..2024-12-31, and the test holdout starts 2025-01-01 and is
  # never used for selection. purge_periods defaults to forward_periods.
  train_end_date: "2020-12-31"
  validation_end_date: "2024-12-31"
  test_start_date: "2021-01-01"

  # Sector-neutral rank IC. Uses data/sp500/sectors.csv for the Yahoo path and
  # the SIC map for the CRSP path.
  sector_neutralize: true
  min_names: 10

  # Cost-aware screen and IC decay for the chosen signal.
  cost_bps: 10.0
  screen_quantile: 0.2
  ic_decay_horizons: "1,5,10,21,63"

  # Cloudflare R2 is the data and results plane. `data_source` is a panel URI
  # (r2://bucket/key); when set, panels are read in memory and no CSV is staged.
  # `results_uri` is a prefix for saved results and the default ledger location.
  # Both fall back to QSD_DATA_SOURCE / QSD_RESULTS_URI. Null means the local
  # Yahoo CSV fallback, which is not the intended production path.
  data_source: null
  results_uri: null

  # Persistent trial ledger: enables de-duplication and Benjamini-Hochberg FDR
  # over the whole search history. Defaults to <results_uri>/trials.jsonl.
  registry_path: null
  dedupe_trials: true

  save_results: true
